name: Verify & Build Plugin Store Submissions (Decky-Style)

on:
  pull_request:
    paths:
      - 'plugins/store.json'
      - 'plugins/submissions/**'
      - '.github/workflows/verify-plugin-store.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  audit-plugin-store:
    name: Decky-Style Source Commit Audit & Clean-Room Build
    runs-on: windows-latest
    steps:
      - name: Checkout HaloDeck repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK (for C# plugin backend source builds)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate plugins/store.json schema and security rules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $storePath = "plugins/store.json"
          if (-not (Test-Path $storePath)) { throw "Missing plugins/store.json" }

          $store = Get-Content $storePath -Raw | ConvertFrom-Json
          if (-not $store.storeName) { throw "store.json missing storeName" }
          if ($null -eq $store.plugins) { throw "store.json missing plugins array" }

          $seenIds = @{}
          foreach ($p in $store.plugins) {
            if (-not ($p.id -match '^[a-z0-9][a-z0-9._-]{2,63}$') -or $p.id.Contains('..')) {
              throw "Invalid plugin id: $($p.id)"
            }
            if ($seenIds.ContainsKey($p.id)) {
              throw "Duplicate plugin id in store.json: $($p.id)"
            }
            $seenIds[$p.id] = $true

            if (-not ($p.zipUrl -match '^https://')) {
              throw "Plugin $($p.id) zipUrl must use HTTPS: $($p.zipUrl)"
            }
            if ($p.zipUrl -match '/releases/latest/') {
              throw "Plugin $($p.id) zipUrl must NOT use mutable /releases/latest/; pin an immutable versioned release + sha256."
            }
            if (-not ($p.sha256 -match '^[a-fA-F0-9]{64}$')) {
              throw "Plugin $($p.id) MUST pin an exact 64-hex sha256 in store.json."
            }
            $isOfficialRepo = $p.zipUrl -match '^https://github\.com/Lokilankaaa/HaloDeck/releases/download/'
            if (-not $isOfficialRepo) {
              if (-not ($p.sourceRepo -match '^https://github\.com/[^/]+/[^/]+') -or -not ($p.sourceCommit -match '^[a-fA-F0-9]{40}$')) {
                throw "Third-party plugin $($p.id) MUST pin sourceRepo and full 40-char sourceCommit SHA (Decky policy)."
              }
            }
          }
          Write-Host "Validated $($store.plugins.Count) store.json entries."

      - name: Clean-room clone, static scan, build & generate audit report
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path "dist/audited-plugins" | Out-Null

          $reportLines = New-Object System.Collections.Generic.List[string]
          $reportLines.Add("### 🛡️ HaloDeck Decky 风格插件安全审核报告")
          $reportLines.Add("")

          $subFiles = Get-ChildItem -Path "plugins/submissions" -Filter "*.json" -ErrorAction SilentlyContinue
          if (-not $subFiles) {
            $reportLines.Add("本次提交未包含新的 `plugins/submissions/*.json` 社区投稿清单；`plugins/store.json` 规范与 SHA-256 校验已全部通过 ✅。")
            $reportLines -join "`n" | Set-Content -Path "dist/audit-report.md" -Encoding UTF8
            $reportLines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding UTF8
            exit 0
          }

          $allowedPerms = @(
            'games:read','telemetry:read','events:game','storage',
            'shell:openFolder','shell:openUrl','ui:theme','backend','input:sendKey'
          )
          $forbiddenBinaryExts = @('.exe','.dll','.sys','.ocx','.scr','.com','.msi','.pyd','.so','.dylib')
          $suspiciousPatterns = @(
            '(?i)-enc(odedcommand)?\b',
            '(?i)\bInvoke-Expression\b',
            '(?i)\bIEX\s*\(',
            '(?i)DownloadString\s*\(',
            '(?i)FromBase64String\s*\(',
            '(?i)\bschtasks(\.exe)?\b',
            '(?i)HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run',
            '(?i)HKLM\\Software\\Microsoft\\Windows\\CurrentVersion\\Run'
          )

          $reportLines.Add("| 插件 ID | 版本 | 锁定 Commit | 后端类型 | 申请权限 | Clean-Room SHA-256 |")
          $reportLines.Add("| :--- | :--- | :--- | :--- | :--- | :--- |")

          foreach ($sf in $subFiles) {
            Write-Host "=== Auditing submission: $($sf.Name) ==="
            $sub = Get-Content $sf.FullName -Raw | ConvertFrom-Json

            if (-not ($sub.id -match '^[a-z0-9][a-z0-9._-]{2,63}$') -or $sub.id.Contains('..')) {
              throw "Invalid submission id: $($sub.id)"
            }
            if (-not ($sub.repo -match '^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/?$')) {
              throw "Submission $($sub.id) repo must be an open-source GitHub HTTPS URL."
            }
            if (-not ($sub.commit -match '^[a-fA-F0-9]{40}$')) {
              throw "Submission $($sub.id) MUST pin a full 40-character immutable Git commit SHA."
            }

            $workDir = Join-Path $env:RUNNER_TEMP ("plugin_audit_" + $sub.id)
            if (Test-Path $workDir) { Remove-Item $workDir -Recurse -Force }

            git clone --filter=blob:none --no-checkout $sub.repo $workDir
            Push-Location $workDir
            try {
              git checkout --detach $sub.commit
              $headSha = (git rev-parse HEAD).Trim()
              if ($headSha -ne $sub.commit) {
                throw "Checked out SHA ($headSha) != pinned commit ($($sub.commit))"
              }

              $subPath = if ($sub.subpath) { $sub.subpath } else { "." }
              $pluginDir = (Resolve-Path (Join-Path $workDir $subPath)).Path

              # 1. Reject pre-compiled opaque binaries committed in source tree
              $precompiled = Get-ChildItem -Path $pluginDir -Recurse -File |
                Where-Object { $forbiddenBinaryExts -contains $_.Extension.ToLowerInvariant() }
              if ($precompiled) {
                $names = ($precompiled | Select-Object -ExpandProperty Name) -join ', '
                throw "Submission $($sub.id) contains pre-compiled binaries in source ($names). Build from source in CI instead."
              }

              # 2. Validate plugin.json manifest
              $manifestPath = Join-Path $pluginDir "plugin.json"
              if (-not (Test-Path $manifestPath)) {
                throw "Submission $($sub.id) missing plugin.json at $subPath"
              }
              $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
              if ($manifest.id -ne $sub.id) {
                throw "Submission id ($($sub.id)) != plugin.json id ($($manifest.id))"
              }
              $perms = @($manifest.permissions)
              foreach ($perm in $perms) {
                if ($allowedPerms -notcontains $perm) {
                  throw "Unknown permission '$perm' in $($sub.id)"
                }
              }

              # 3. Static heuristic scan on all script/code files
              $textFiles = Get-ChildItem -Path $pluginDir -Recurse -File |
                Where-Object { $_.Extension.ToLowerInvariant() -in @('.js','.ts','.html','.ps1','.cmd','.bat','.cs','.py') }
              foreach ($tf in $textFiles) {
                $content = Get-Content $tf.FullName -Raw -ErrorAction SilentlyContinue
                if (-not $content) { continue }
                foreach ($pat in $suspiciousPatterns) {
                  if ($content -match $pat) {
                    throw "Suspicious pattern '$pat' detected in $($sub.id)/$($tf.Name) — requires manual security review."
                  }
                }
              }

              # 4. Clean-room source build if a .csproj backend is declared
              $backendType = "纯前端沙箱"
              $csproj = Get-ChildItem -Path $pluginDir -Filter "*.csproj" -Recurse | Select-Object -First 1
              if ($csproj) {
                $backendType = "C# 源码编译"
                Write-Host "Building backend from source: $($csproj.FullName)"
                dotnet publish $csproj.FullName -c Release -r win-x64 --self-contained false -o (Join-Path $pluginDir "backend")
              } elseif ($manifest.backend -and $manifest.backend.executable) {
                $backendType = "脚本后端 ($($manifest.backend.executable))"
              }

              # 5. Package clean-room zip & print SHA-256
              $stageDir = Join-Path $env:RUNNER_TEMP ("plugin_zip_stage_" + $sub.id)
              if (Test-Path $stageDir) { Remove-Item $stageDir -Recurse -Force }
              $stageInner = Join-Path $stageDir $sub.id
              New-Item -ItemType Directory -Force -Path $stageInner | Out-Null
              Get-ChildItem -Path $pluginDir -Force | Where-Object { $_.Name -notin @('.git','bin','obj') } | ForEach-Object {
                Copy-Item -Path $_.FullName -Destination (Join-Path $stageInner $_.Name) -Recurse -Force
              }

              $zipOut = Join-Path $env:GITHUB_WORKSPACE ("dist/audited-plugins/$($sub.id)-$($manifest.version).zip")
              Compress-Archive -Path $stageInner -DestinationPath $zipOut -Force
              $sha = (Get-FileHash $zipOut -Algorithm SHA256).Hash.ToLowerInvariant()
              $shortSha = $sub.commit.Substring(0, 10)
              $permStr = if ($perms.Count -gt 0) { ($perms | ForEach-Object { '`' + $_ + '`' }) -join ', ' } else { "无" }
              $commitLink = "[$shortSha]($($sub.repo.TrimEnd('/'))/commit/$($sub.commit))"
              $reportLines.Add("| ``$($sub.id)`` | v$($manifest.version) | $commitLink | $backendType | $permStr | ``$sha`` |")
              Write-Host "AUDITED OK: $($sub.id) v$($manifest.version) | commit=$($sub.commit) | sha256=$sha"
            } finally {
              Pop-Location
            }
          }

          $reportLines.Add("")
          $reportLines.Add("> ✅ 零黑盒二进制检查与静态高危扫描全部通过。合并至 `main` 后，`publish-plugin-store.yml` 将自动从锁定 Commit 干净重编译、发布至 `plugin-store-builds` Release 并同步更新 `plugins/store.json`。")
          $reportText = $reportLines -join "`n"
          $reportText | Set-Content -Path "dist/audit-report.md" -Encoding UTF8
          $reportText | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding UTF8

      - name: Post or update PR audit summary comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('dist/audit-report.md')) return;
            const body = fs.readFileSync('dist/audit-report.md', 'utf8');
            const marker = '<!-- halodeck-plugin-audit -->';
            const fullBody = `${marker}\n${body}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }

      - name: Upload clean-room built plugin zips as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audited-plugin-builds
          path: dist/audited-plugins/*.zip
          if-no-files-found: ignore
