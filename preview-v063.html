<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HaloDeck v0.6.3 · 1:1 真实交互重构预览器</title>
  <style>
    :root {
      --shell-bg: #080d17;
      --shell-bar: rgba(15, 23, 42, 0.92);
      --shell-border: rgba(148, 163, 184, 0.22);
      --shell-text: #f1f5f9;
      --shell-muted: #94a3b8;
      --shell-accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 18% 12%, rgba(56, 189, 248, 0.12), transparent 45%),
        radial-gradient(circle at 82% 88%, rgba(45, 212, 191, 0.10), transparent 45%),
        var(--shell-bg);
      color: var(--shell-text);
      font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", sans-serif;
      display: flex;
      flex-direction: column;
    }
    .preview-toolbar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px 18px;
      background: var(--shell-bar);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--shell-border);
    }
    .toolbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .toolbar-badge {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(56, 189, 248, 0.16);
      border: 1px solid rgba(56, 189, 248, 0.42);
      color: #7dd3fc;
    }
    .toolbar-title {
      font-size: 14px;
      font-weight: 800;
    }
    .toolbar-sub {
      font-size: 11.5px;
      color: var(--shell-muted);
    }
    .toolbar-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .seg {
      display: inline-flex;
      padding: 3px;
      gap: 3px;
      border-radius: 10px;
      background: rgba(2, 6, 23, 0.65);
      border: 1px solid var(--shell-border);
    }
    .seg button, .ctrl-btn {
      border: 1px solid transparent;
      background: transparent;
      color: var(--shell-muted);
      padding: 5px 11px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.14s ease;
    }
    .seg button:hover, .ctrl-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }
    .seg button.active {
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      color: #ffffff;
      box-shadow: 0 3px 10px rgba(14, 165, 233, 0.35);
    }
    .ctrl-btn {
      border-color: var(--shell-border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--shell-text);
    }
    .stage {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 20px;
      padding: 20px;
      overflow: auto;
    }
    .frame-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .frame-card.hidden { display: none; }
    .frame-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--shell-muted);
      padding: 0 4px;
    }
    .frame-label strong { color: var(--shell-text); }
    .frame-wrap {
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.28);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      background: #070b14;
    }
    .frame-wrap iframe {
      display: block;
      border: 0;
      background: transparent;
    }
    .frame-console iframe {
      width: 1200px;
      height: 640px;
    }
    .frame-qam iframe {
      width: 440px;
      height: 720px;
    }
    body.capture-only {
      background: transparent;
    }
    body.capture-only .preview-toolbar,
    body.capture-only .frame-label {
      display: none !important;
    }
    body.capture-only .stage {
      padding: 0;
      margin: 0;
      justify-content: flex-start;
    }
    body.capture-only .frame-wrap {
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }
  </style>
</head>

              <stop offset="100%" stop-color="${c2}"/>

          <rect width="420" height="220" fill="url(#g)"/>
          <rect width="420" height="220" fill="url(#r)"/>

          <path d="M0 190 Q140 120 280 165 T420 130 L420 220 L0 220 Z" fill="${accent}" fill-opacity="0.12"/>

      let mockState = createInitialMockState();

      function clone(obj) {
        return JSON.parse(JSON.stringify(obj));
      }

      function getFrames() {
        return [document.getElementById("frameConsole"), document.getElementById("frameQam")].filter(Boolean);
      }

      function broadcastEvent(eventName, data) {
        getFrames().forEach((fr) => {
          try {
            fr.contentWindow?.postMessage({ __halodeckMockReply: true, payload: { type: "event", eventName, data } }, "*");
          } catch {}
        });
      }

      function broadcastSnapshot() {
        syncToolbarButtons();
        broadcastEvent("stateChanged", clone(mockState));
      }

      function resolveCurrentCompState() {
        const comps = mockState.components || [];
        const hasCore = comps.some((c) => (c.slot === "OptiScalerNightly" || c.slot === "OptiScalerStable") && c.isInstalled);
        const hasMfg = comps.some((c) => c.slot === "MfgUnlocker" && c.isInstalled);
        if (!hasCore) return "fresh";
        if (!hasMfg) return "nomfg";
        return "all";
      }

      function applyCompState(mode) {
        const freshDefaults = createInitialMockState();
        const baseComps = freshDefaults.components;
        const baseFirstGameInj = {
          isInjected: true,
          proxyDllName: "dxgi.dll",
          appliedConfig: {
            proxyDllName: "dxgi.dll",
            srMode: "fsr4_int8",
            fgType: "xefg",
            fgInputMode: "auto",
            enableOptiPatcher: true,
            enableFakenvapi: true,
            enableCustomDlls: true,
            spoofDxgi: true,
            framerateLimit: 116,
            vsyncMode: "on",
            xeFgMultiplier: 2,
            xeFgDynamicMfg: false,
            xeFgDynamicTargetFps: 0
          }
        };

        mockState.components.forEach((c) => {
          const ref = baseComps.find((x) => x.slot === c.slot);
          c.isInstalled = true;
          c.installedVersion = ref?.latestVersion || c.latestVersion || "v1.0.0";
          c.hasUpdate = false;
        });

        if (mode === "fresh") {
          mockState.components.forEach((c) => {
            c.isInstalled = false;
            c.installedVersion = null;
            c.hasUpdate = false;
          });
          mockState.games[0].injection = { isInjected: false };
        } else if (mode === "nomfg") {
          const mfg = mockState.components.find((c) => c.slot === "MfgUnlocker");
          if (mfg) {
            mfg.isInstalled = false;
            mfg.installedVersion = null;
            mfg.hasUpdate = false;
          }
          baseFirstGameInj.appliedConfig.xeFgMultiplier = 3;
          mockState.games[0].injection = baseFirstGameInj;
        } else {
          mockState.games[0].injection = baseFirstGameInj;
        }
        mockState.activeInspectGame = mockState.games[0];
        broadcastSnapshot();
      }

      function syncToolbarButtons() {
        const theme = mockState.settings.uiTheme;
        const layout = mockState.settings.uiLayout;
        const scene = mockState.runningGame ? "gaming" : "standby";
        const updFlag = mockState.latestUpdate?.hasUpdate ? "1" : "0";
        const compState = resolveCurrentCompState();
        document.querySelectorAll("[data-mock-theme]").forEach((b) => b.classList.toggle("active", b.dataset.mockTheme === theme));
        document.querySelectorAll("[data-mock-layout]").forEach((b) => b.classList.toggle("active", b.dataset.mockLayout === layout));
        document.querySelectorAll("[data-mock-scene]").forEach((b) => b.classList.toggle("active", b.dataset.mockScene === scene));
        document.querySelectorAll("[data-mock-comp]").forEach((b) => b.classList.toggle("active", b.dataset.mockComp === compState));
        document.querySelectorAll("[data-mock-upd]").forEach((b) => b.classList.toggle("active", b.dataset.mockUpd === updFlag));
      }

              mockState.frozenGames = mockState.frozenGames.length ? [] : [{ pid: 10248, title: "真·三国无双 起源" }];
              broadcastSnapshot();
              return { ok: true, message: mockState.frozenGames.length ? "已将《真·三国无双 起源》挂起省电" : "已解冻恢复游戏运行" };
            }
            return { ok: true, message: `已执行快捷操作：${payload.action}` };
          case "toggleQam":
            setView("both");
            return { ok: true };
          case "showConsole":
            setView("console");
            if (payload.tab) {
              broadcastEvent("navigateConsoleTab", { tab: payload.tab, subtab: payload.subtab });
            }
            return { ok: true };
          case "openExternalUrl":
            return { ok: true, url: payload.url, message: `预览模式：外部链接 ${payload.url}` };
          case "openFolder":
            return { opened: true, path: payload.path };
          case "openSettingsJson":
            return { ok: true, message: "预览模式：settings.json 位于 AppData\\Local\\HaloDeck" };
          case "reloadSettingsJson":
            broadcastSnapshot();
            return { ok: true, message: "已重载本地配置" };
          case "enableWindowedVrr":
            mockState.vrrWindowedEnabled = true;
            broadcastSnapshot();
            return { ok: true, message: "已开启 Win11 窗口化 VRR 优化" };
          case "installHardwareService":
            hw.serviceRunning = true;
            hw.smuReady = true;
            hw.ecReady = true;
            broadcastSnapshot();
            return { ok: true, message: "HaloDeckHardwareSvc v5 运行正常" };
          case "toggleGpdService":
            hw.gpdServiceRunning = !payload.paused;
            broadcastSnapshot();
            return { ok: true, message: hw.gpdServiceRunning ? "已恢复 GPDTools 服务" : "已暂停 GPDTools 服务" };
          default:
            return { ok: true };
        }
      }

      window.addEventListener("message", async (ev) => {
        const d = ev.data;
        if (!d || !d.__halodeckMockRpc || !d.payload) return;
        const { id, method, payload } = d.payload;
        try {
          const result = await handleMockRpc(method, payload);
          ev.source?.postMessage({ __halodeckMockReply: true, payload: { type: "response", id, ok: true, result } }, "*");
        } catch (err) {
          ev.source?.postMessage({ __halodeckMockReply: true, payload: { type: "response", id, ok: false, error: err?.message || String(err) } }, "*");
        }
      });

      function setView(view) {
        const c = document.getElementById("cardConsole");
        const q = document.getElementById("cardQam");
        c.classList.toggle("hidden", view === "qam");
        q.classList.toggle("hidden", view === "console");
        document.querySelectorAll("[data-view]").forEach((b) => b.classList.toggle("active", b.dataset.view === view));
      }

      document.querySelectorAll("[data-view]").forEach((btn) => {
        btn.addEventListener("click", () => setView(btn.dataset.view));
      });
      document.querySelectorAll("[data-mock-theme]").forEach((btn) => {
        btn.addEventListener("click", () => {
          mockState.settings.uiTheme = btn.dataset.mockTheme;
          broadcastSnapshot();
        });
      });
      document.querySelectorAll("[data-mock-layout]").forEach((btn) => {
        btn.addEventListener("click", () => {
          mockState.settings.uiLayout = btn.dataset.mockLayout;
          broadcastSnapshot();
        });
      });
      document.querySelectorAll("[data-mock-scene]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const gaming = btn.dataset.mockScene === "gaming";
          mockState.games[0].isCurrentlyRunning = gaming;
          mockState.runningGame = gaming ? mockState.games[0] : null;
          mockState.systemControl.currentFps = gaming ? 98 : 0;
          mockState.systemControl.apuPowerWatts = gaming ? 37.8 : 11.4;
          mockState.systemControl.systemDrawWatts = gaming ? 49.4 : 18.2;
          mockState.systemControl.gpuUsagePercent = gaming ? 92 : 8;
          mockState.systemControl.gfxClockMhz = gaming ? 2480 : 800;
          mockState.systemControl.isOnAcPower = gaming;
          mockState.systemControl.isCharging = false;
          broadcastSnapshot();
        });
      });
      document.querySelectorAll("[data-mock-comp]").forEach((btn) => {
        btn.addEventListener("click", () => {
          applyCompState(btn.dataset.mockComp);
        });
      });
      document.querySelectorAll("[data-mock-upd]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const hasUpd = btn.dataset.mockUpd === "1";
          mockState.latestUpdate.hasUpdate = hasUpd;
          mockState.latestUpdate.latestVersion = hasUpd ? "0.6.4" : mockState.appVersion;
          broadcastSnapshot();
        });
      });
      document.getElementById("btnResetMock")?.addEventListener("click", () => {
        mockState = createInitialMockState();
        broadcastSnapshot();
      });

      const initView = params.get("view") || "console";
      setView(initView);
      syncToolbarButtons();

      // Optional URL navigation for automated screenshot verification
      const initTab = params.get("tab");
      const initSub = params.get("sub");
      const initQamTab = params.get("qtab");
      if (initTab) {
        document.getElementById("frameConsole")?.addEventListener("load", () => {
          setTimeout(() => {
            broadcastEvent("navigateConsoleTab", { tab: initTab, subtab: initSub || undefined });
          }, 180);
        });
      }
      if (initQamTab) {
        document.getElementById("frameQam")?.addEventListener("load", () => {
          setTimeout(() => {
            broadcastEvent("navigateQamTab", { tab: initQamTab });
          }, 220);
        });
      }
    })();
  </script>
</body>
</html>
