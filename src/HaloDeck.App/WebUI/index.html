<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HaloDeck · 掌机全能控制中心</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="mode-console" data-theme="aurora" data-layout="bento">
  <!-- Dynamic Game Hero Blurred Backdrop -->
  <div id="ambientBackdrop" class="ambient-backdrop" aria-hidden="true">
    <img id="ambientHeroImg" class="ambient-hero-img is-empty" alt="" />
    <div class="ambient-vignette"></div>
  </div>

  <div id="appShell" class="app-shell">
    <!-- Console Top Navigation Bar (48px, hidden in QAM mode) -->
    <header id="topBar" class="top-bar">
      <div class="top-brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 20.5 7 20.5 17 12 22 3.5 17 3.5 7"></polygon>
            <circle cx="12" cy="12" r="3.2"></circle>
          </svg>
        </div>
        <div class="brand-copy">
          <span class="brand-title">HaloDeck</span>
          <span id="deviceTag" class="brand-sub">GPD WIN 5 · 8060S</span>
        </div>
      </div>

      <nav class="top-nav" aria-label="主功能导航">
        <span class="bumper-cap" title="LB 向左切换">LB</span>
        <button class="tab-btn active" data-nav="handheld" data-focusable="true">快捷总控</button>
        <button class="tab-btn" data-nav="opti" data-focusable="true">游戏与超分</button>
        <button class="tab-btn" data-nav="monitor" data-focusable="true">硬件与监控</button>
        <button class="tab-btn" data-nav="controls" data-focusable="true">手柄与设置</button>
        <button class="tab-btn tab-btn-plugins" data-nav="plugins" data-focusable="true">插件扩展<span id="topPluginCount" class="plugin-count-dot hidden">0</span></button>
        <span class="bumper-cap" title="RB 向右切换">RB</span>
      </nav>

      <div class="top-actions">
        <button id="topApuChip" class="gp-status-chip sys-top-chip" data-focusable="true" title="点击查看硬件精调与监控">
          <span id="topApuLabel">APU --W · --°C</span>
        </button>

        <button id="topSysChip" class="gp-status-chip sys-top-chip" data-focusable="true" title="点击回到快捷总控">
          <span id="topSysLabel">1080p · --Hz · --%</span>
        </button>

        <div id="controllerChip" class="gp-status-chip" title="控制器连接状态">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="6" width="20" height="12" rx="5"></rect>
            <path d="M7 12h4M9 10v4"></path>
            <circle cx="15.5" cy="11" r="0.8" fill="currentColor"></circle>
            <circle cx="17.5" cy="13" r="0.8" fill="currentColor"></circle>
          </svg>
          <span id="controllerLabel">键鼠 / 触摸</span>
        </div>

        <button id="btnLayoutSwitch" class="top-pill-btn" data-focusable="true" title="切换布局风格：掌机大磁贴 / 桌面仪表盘">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="8" height="8" rx="2"></rect>
            <rect x="13" y="3" width="8" height="5" rx="1.6"></rect>
            <rect x="13" y="10" width="8" height="11" rx="2"></rect>
            <rect x="3" y="13" width="8" height="8" rx="2"></rect>
          </svg>
          <span id="topLayoutLabel">磁贴</span>
        </button>

        <button id="btnThemeSwitch" class="top-pill-btn theme-pill-btn" data-focusable="true" title="切换深浅配色：极光深色 / 凝霜浅色">
          <span class="theme-dot" aria-hidden="true"></span>
          <span id="topThemeLabel">极光</span>
        </button>

        <button id="btnOpenQam" class="top-pill-btn" data-focusable="true" title="打开右侧掌机快捷侧栏">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2"></rect>
            <line x1="15" y1="4" x2="15" y2="20"></line>
          </svg>
          <span>快捷侧栏</span>
        </button>

        <div class="win-controls">
          <button id="btnMinimize" class="win-btn" title="最小化到托盘" aria-label="最小化">
            <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="3" y1="11" x2="13" y2="11"></line></svg>
          </button>
          <button id="btnFullscreen" class="win-btn" title="切换全屏掌机模式" aria-label="全屏">
            <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="10" height="10" rx="1.2"></rect></svg>
          </button>
          <button id="btnCloseApp" class="win-btn win-btn-close" title="隐藏到系统托盘" aria-label="关闭">
            <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="4" y1="4" x2="12" y2="12"></line><line x1="12" y1="4" x2="4" y2="12"></line></svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Primary Content Region (dynamically rendered for Console OR QAM mode) -->
    <main id="mainView" class="main-view"></main>

    <!-- Right Vertical Icon Rail (visible only in QAM mode, matched to frequency order) -->
    <aside id="qamRail" class="qam-rail hidden" aria-label="侧栏页面切换">
      <span class="qam-bumper">LB</span>
      <div class="qam-rail-items">
        <button class="qam-rail-btn active" data-qam-tab="handheld" title="一屏快捷总控">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="8" height="8" rx="2.2"></rect>
            <rect x="13" y="3" width="8" height="8" rx="2.2"></rect>
            <rect x="3" y="13" width="8" height="8" rx="2.2"></rect>
            <rect x="13" y="13" width="8" height="8" rx="2.2"></rect>
          </svg>
        </button>
        <button class="qam-rail-btn" data-qam-tab="opti" title="游戏专属与超分">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </button>
        <button class="qam-rail-btn" data-qam-tab="osd" title="硬件微调与监控">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 20 9 4 6 12 2 12"></polyline>
          </svg>
        </button>
        <button class="qam-rail-btn" data-qam-tab="controls" title="手柄与系统设置">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="6" width="20" height="12" rx="4"></rect>
            <path d="M6 12h4M8 10v4"></path>
            <circle cx="15.5" cy="11" r="1"></circle>
            <circle cx="17.5" cy="13" r="1"></circle>
          </svg>
        </button>
        <button class="qam-rail-btn" data-qam-tab="plugins" title="社区插件 (Decky)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22v-5"></path>
            <path d="M9 8V2"></path>
            <path d="M15 8V2"></path>
            <path d="M18 8v5a6 6 0 0 1-12 0V8z"></path>
          </svg>
        </button>
      </div>
      <span class="qam-bumper">RB</span>
    </aside>

    <!-- Handheld Bottom Action Prompt Strip -->
    <footer id="gamepadLegend" class="bottom-legend"></footer>
  </div>

  <!-- Frosted Diagnostics / INI Viewer / Back-Key Picker Modal -->
  <div id="modalBackdrop" class="modal-backdrop hidden">
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <div>
          <h3 id="modalTitle" class="modal-title">诊断详情</h3>
          <p id="modalSubtitle" class="modal-sub"></p>
        </div>
        <button id="btnCloseModal" class="btn btn-sm" data-focusable="true">关闭 [B]</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <!-- Non-blocking Floating Toasts -->
  <div id="toastStack" class="toast-stack" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
