<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>独立后端通信示例</title>
  <script src="https://app.halodeck.local/plugin-sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
      background: var(--bg-app, #0b111b);
      color: var(--text-primary, #f1f5f9);
      font-size: 13px;
    }
    .card {
      background: var(--bg-card, #111827);
      border: 1px solid var(--border, rgba(255,255,255,0.1));
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      border: 1px solid var(--accent, #1a8cff);
      background: var(--accent, #1a8cff);
      color: #fff;
      padding: 7px 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    button.sec {
      background: var(--bg-well, #0d1422);
      color: var(--text-primary, #f1f5f9);
      border-color: var(--border, rgba(255,255,255,0.15));
    }
    pre {
      margin: 0;
      padding: 10px;
      border-radius: 8px;
      background: var(--bg-well, #0d1422);
      border: 1px solid var(--border, rgba(255,255,255,0.1));
      font-size: 11.5px;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="card">
    <strong>stdio JSON-RPC 2.0 后端测试</strong>
    <div class="row">
      <button id="btnPing">调用后端 ping()</button>
      <button id="btnTel" class="sec">读取硬件遥测</button>
      <button id="btnDir" class="sec">打开数据目录</button>
    </div>
    <pre id="out">点击按钮测试隔离后端进程通信...</pre>
  </div>
  <script>
    (async () => {
      await HaloDeckPlugin.ready();
      const out = document.getElementById("out");

      HaloDeckPlugin.onEvent((name, data) => {
        out.textContent = `[事件 ${name}] ${JSON.stringify(data, null, 2)}\n` + out.textContent;
      });

      document.getElementById("btnPing").addEventListener("click", async () => {
        try {
          const res = await HaloDeckPlugin.backend.call("ping", { message: "Hello HaloDeck Plugin Host!" });
          out.textContent = JSON.stringify(res, null, 2);
          HaloDeckPlugin.toast(`后端响应成功 (PID ${res.pid})`, "success");
        } catch (err) {
          out.textContent = `错误: ${err.message}`;
        }
      });

      document.getElementById("btnTel").addEventListener("click", async () => {
        const tel = await HaloDeckPlugin.getTelemetry();
        out.textContent = JSON.stringify(tel, null, 2);
      });

      document.getElementById("btnDir").addEventListener("click", () => HaloDeckPlugin.openDataFolder());
    })();
  </script>
</body>
</html>
